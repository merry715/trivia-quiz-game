<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상식 퀴즈 게임</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ① 시작 화면 -->
  <section id="screen-start" class="screen active">
    <div class="card">
      <div class="start-logo">🧠</div>
      <h1 class="start-title">상식 퀴즈</h1>
      <p class="subtitle">역사 · 과학 · 지리 · 일반 상식</p>
      <div class="form-group">
        <label for="nickname-input">닉네임</label>
        <input id="nickname-input" type="text" maxlength="10"
               placeholder="2~10자를 입력하세요" autocomplete="off">
        <p class="hint">공백만으로는 시작할 수 없습니다</p>
      </div>
      <button id="btn-start" class="btn btn-primary" disabled>시작하기</button>
    </div>
  </section>

  <!-- ② 모드 선택 화면 -->
  <section id="screen-mode" class="screen">
    <div class="card">
      <p id="mode-greeting" class="greeting"></p>
      <h2 class="section-title">모드 선택</h2>
      <p class="subtitle">도전할 카테고리를 골라주세요</p>
      <div class="mode-grid">
        <button class="btn btn-mode" data-mode="history">
          <span class="mode-icon">📜</span>
          <span class="mode-name">역사</span>
          <span class="mode-count">10문제</span>
        </button>
        <button class="btn btn-mode" data-mode="science">
          <span class="mode-icon">🔬</span>
          <span class="mode-name">과학</span>
          <span class="mode-count">10문제</span>
        </button>
        <button class="btn btn-mode" data-mode="geography">
          <span class="mode-icon">🌍</span>
          <span class="mode-name">지리</span>
          <span class="mode-count">10문제</span>
        </button>
        <button class="btn btn-mode" data-mode="general">
          <span class="mode-icon">💡</span>
          <span class="mode-name">일반 상식</span>
          <span class="mode-count">10문제</span>
        </button>
      </div>
      <button class="btn btn-all" data-mode="all">
        <span class="mode-icon">🏆</span>
        전체 도전
        <span class="mode-count">40문제</span>
      </button>
    </div>
  </section>

  <!-- ③ 문제 화면 -->
  <section id="screen-quiz" class="screen">
    <div class="card quiz-card">
      <header class="quiz-header">
        <span id="quiz-progress" class="progress-text">1 / 10</span>
        <span id="quiz-category" class="category-badge">역사</span>
        <span id="quiz-score" class="score-text">0점</span>
      </header>
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="quiz-body">
        <p id="quiz-question" class="question-text"></p>
        <div class="choices-grid">
          <button class="btn-choice" data-idx="0"></button>
          <button class="btn-choice" data-idx="1"></button>
          <button class="btn-choice" data-idx="2"></button>
          <button class="btn-choice" data-idx="3"></button>
        </div>
      </div>

      <div id="quiz-feedback" class="feedback hidden">
        <div class="feedback-top">
          <span class="feedback-icon"></span>
          <span class="feedback-verdict"></span>
        </div>
        <p class="feedback-answer"></p>
        <p class="feedback-explanation"></p>
        <button id="btn-next" class="btn btn-primary">다음</button>
      </div>
    </div>
  </section>

  <!-- ④ 결과 화면 (임시) -->
  <section id="screen-result" class="screen">
    <div class="card result-card">
      <div class="result-emoji">🎉</div>
      <h2 class="section-title">퀴즈 완료!</h2>
      <p id="result-nickname" class="result-nickname"></p>
      <div class="result-stats">
        <div class="stat-box">
          <span class="stat-label">최종 점수</span>
          <span id="result-score" class="stat-value"></span>
        </div>
        <div class="stat-box">
          <span class="stat-label">정답률</span>
          <span id="result-rate" class="stat-value"></span>
        </div>
        <div class="stat-box">
          <span class="stat-label">소요 시간</span>
          <span id="result-time" class="stat-value"></span>
        </div>
      </div>
      <button id="btn-restart" class="btn btn-primary">다시 시작</button>
    </div>
  </section>

</div>
<script src="js/app.js"></script>
</body>
</html>
